services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "collabhub"]
      interval: 5s
      timeout: 10s
      retries: 10
    environment:
      - POSTGRES_USER=collabhub
      - POSTGRES_PASSWORD=collabhub
      - POSTGRES_DB=collabhub
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 512M
        reservations:
          cpus: 0.5
          memory: 256M
    ports:
      - 5432:5432
    expose:
      - 5432
    networks:
      - app-network

  # backend:
  #   build: ./backend
  #   expose:
  #     - 3000
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #   networks:
  #     - app-network

  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/dist
    ports:
      - 4200:4200
    # expose:
    #   - 80
    environment:
      - NODE_ENV=development
    networks:
      - app-network

  # reverse-proxy:
  #   image: nginx:alpine
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/nginx.conf
  #   ports:
  #     - 8000:432
  #   depends_on:
  #     - backend
  #     - frontend
  #   networks:
  #     - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
