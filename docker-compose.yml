services:
  db:
    image: postgres:15
    volumes:
      - ./postgres_data:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "collabhub"]
      interval: 1s
      timeout: 5s
      retries: 10
    environment:
      - POSTGRES_USER=collabhub
      - POSTGRES_PASSWORD=collabhub
      - POSTGRES_DB=collabhub
    deploy:
      resources:
        limits:
          cpus: 0.50
          memory: 512M
        reservations:
          cpus: 0.25
          memory: 256M
    ports:
      - 5432:5432
    expose:
      - 5432
    networks:
      - app-network

  backend:
    build: ./backend
    expose:
      - 3000
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  frontend:
    build: ./frontend
    expose:
      - 80
    environment:
      - API_URL=/api
    networks:
      - app-network

  reverse-proxy:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    ports:
      - 80:432
    depends_on:
      - backend
      - frontend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
